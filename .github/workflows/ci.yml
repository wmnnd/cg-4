name: CI

on:
  push:
    branches:
      - claude/port-qt6-fixes-Ugexd
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
            qt_arch: clang_64
          - name: windows
            os: windows-latest
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (Qt6 from apt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            qt6-webengine-dev \
            qt6-webengine-dev-tools \
            libqt6core5compat6-dev \
            libqt6webenginecore6-bin \
            libxkbcommon-dev \
            libnss3

      - name: Install Qt (macOS / Windows)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtwebengine qtwebchannel qtpositioning qt5compat'
          cache: true

      - name: Cache external dependencies
        uses: actions/cache@v4
        with:
          path: external/cache
          key: ${{ runner.os }}-deps-${{ hashFiles('cmake/PrepareDependencies.cmake') }}

      - name: Prepare dependencies
        run: cmake -P cmake/PrepareDependencies.cmake

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage/clipgrab
          cp build/clipgrab stage/clipgrab/

      - name: Stage bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p stage
          cp -R build/ClipGrab.app stage/
          cp external/ffmpeg-bin/ffmpeg stage/ClipGrab.app/Contents/MacOS/
          cp external/deno-bin/deno   stage/ClipGrab.app/Contents/MacOS/
          chmod +x stage/ClipGrab.app/Contents/MacOS/ffmpeg \
                   stage/ClipGrab.app/Contents/MacOS/deno
          # Splice python-build-standalone into the bundle. The app spawns
          # Contents/Frameworks/Python.framework/Versions/Current/bin/python3.
          PY_DEST=stage/ClipGrab.app/Contents/Frameworks/Python.framework/Versions/Current
          mkdir -p "$PY_DEST"
          cp -R external/python-mac/python/. "$PY_DEST/"

      - name: Stage bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/clipgrab | Out-Null
          # Find clipgrab.exe (CMake/MSVC may put it under build/Release or build/)
          $exe = Get-ChildItem -Path build -Filter clipgrab.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "clipgrab.exe not found in build/" }
          Copy-Item $exe.FullName stage/clipgrab/
          Copy-Item external/ffmpeg-bin/ffmpeg.exe stage/clipgrab/
          Copy-Item external/deno-bin/deno.exe   stage/clipgrab/
          Copy-Item -Recurse external/python stage/clipgrab/python

      - name: Zip bundle (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd stage
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            zip -ry "../clipgrab-${{ matrix.name }}.zip" ClipGrab.app
          else
            zip -r "../clipgrab-${{ matrix.name }}.zip" clipgrab
          fi

      - name: Zip bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Git Bash on the Windows runner doesn't ship `zip`; use PowerShell.
        run: Compress-Archive -Path stage/clipgrab -DestinationPath clipgrab-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipgrab-${{ matrix.name }}
          path: clipgrab-${{ matrix.name }}.zip
          if-no-files-found: error
